<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Mountain Desktop UI</title>

    <!-- Google Fonts for the exact clean, futuristic, and geometric look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for the Dock Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="ui-switcher.css">

    <style>
        :root {
            --primary-font: 'Orbitron', sans-serif; /* For the stylized day header */
            --mono-font: 'Share Tech Mono', monospace; /* For the precise date/time look */
            --sans-font: 'Montserrat', sans-serif; /* For the clean weather description */
            --text-color: rgba(255, 255, 255, 0.9);
            --text-dim: rgba(255, 255, 255, 0.65);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--sans-font);
            background-color: #0b131a;
        }

        /* Fullscreen Background Image matching the mountain aesthetic */
        .background-container {
            position: absolute;
            inset: 0;
            background-color: #ffffff00;
            background-image:
                linear-gradient(135deg, rgba(11, 19, 26, 0.35), rgba(11, 19, 26, 0.55)),
                url('https://i.pinimg.com/1200x/4d/5e/f9/4d5ef94f9a038da39c34db143e5b98e0.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            filter: brightness(1.25) contrast(1.05);
            z-index: 0;
        }

        /* Main Workspace Overlay */
        .desktop-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 5vh 2vw;
            color: var(--text-color);
        }

        /* Top Widget: Clock & Date */
        .top-widget {
            position: relative;
            z-index: 2;
            flex: 0 0 auto;
            width: min(92vw, 1100px);
            text-align: center;
            margin-top: 4vh;
        }

        .day-display {
            font-family: var(--primary-font);
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: 1.8rem;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            margin-left: 1.8rem; /* Counteracts the last letter-spacing push */
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .date-display {
            font-family: var(--mono-font);
            font-size: 1.1rem;
            letter-spacing: 0.3rem;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-top: 10px;
        }

        .time-display {
            font-family: var(--mono-font);
            font-size: 1rem;
            letter-spacing: 0.2rem;
            color: var(--text-dim);
            margin-top: 5px;
        }

        /* Center-Bottom Widget: Visualizer & Weather */
        .center-widget {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 8vh;
            width: 100%;
            max-width: 600px;
        }

        /* Static/Animated Peak Visualizer Bars */
        .visualizer-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            height: 60px;
            margin-bottom: 20px;
            width: 100%;
        }

        .bar {
            width: 3px;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 1px;
            transition: height 0.15s ease;
        }

        .weather-info {
            font-family: var(--sans-font);
            font-size: 0.88rem;
            font-weight: 400;
            line-height: 1.6;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 0.05rem;
            max-width: 90%;
        }

        .weather-highlight {
            color: #f39c12; /* Golden orange accent for "Sunny" */
            font-weight: 500;
        }

        /* Bottom App Dock */
        .dock-container {
            position: absolute;
            bottom: 3vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.07);
            padding: 10px 25px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            gap: 18px;
        }

        .dock-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .dock-icon:hover {
            transform: translateY(-8px) scale(1.15);
            background: rgba(255, 255, 255, 0.2) !important;
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
        }

        /* Specific icon brand colors to closely mimic the reference dock */
        .icon-folder { background: #f1c40f; }
        .icon-settings { background: #7f8c8d; }
        .icon-browser1 { background: #c0392b; }
        .icon-browser2 { background: #d35400; }
        .icon-video { background: #e74c3c; }
        .icon-design1 { background: #2980b9; }
        .icon-design2 { background: #8e44ad; }
        .icon-design3 { background: #27ae60; }
        .icon-effects { background: #16a085; }
        .icon-word { background: #2980b9; }
        .icon-spotify { background: #2ecc71; }
        .icon-games { background: #2c3e50; }

        /* Little active indicator dot */
        .dock-icon.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            width: 4px;
            height: 4px;
            background-color: #ffffff;
            border-radius: 50%;
        }

        /* Bottom Right Watermark */
        .watermark {
            position: absolute;
            bottom: 3vh;
            right: 3vw;
            font-size: 0.75rem;
            font-family: var(--sans-font);
            letter-spacing: 0.15rem;
            color: rgba(255, 255, 255, 0.4);
            text-transform: lowercase;
        }

    </style>
</head>
<body>
    <div class="background-container"></div>

    <div class="desktop-container">
        <!-- Top Date/Time Widget -->
        <div class="top-widget">
            <div class="day-display" id="day-box">Saturday</div>
            <div class="date-display" id="date-box">26 December, 2020</div>
            <div class="time-display" id="time-box">- 13:35 -</div>
        </div>

        <!-- Visualizer & Weather Context -->
        <div class="center-widget">
            <div class="visualizer-container" id="visualizer">
                <!-- Javascript will generate the geometric peak bars here -->
            </div>
            <div class="weather-info">
                Weather near <span id="weather-location">your location</span> is <span class="weather-highlight" id="weather-condition">loading</span> with <span id="weather-temperature">--</span>.<br>
                Wind is <span id="weather-wind">--</span> and humidity is <span id="weather-humidity">--</span>.
            </div>
        </div>

        <!-- App Dock Launcher -->
        <div class="dock-container">
            <a class="dock-icon icon-folder" data-shortcut-slot="0" href="#" title="Shortcut 1"><i class="fa-regular fa-folder-open"></i></a>
            <a class="dock-icon icon-settings" data-shortcut-slot="1" href="#" title="Shortcut 2"><i class="fa-solid fa-gear"></i></a>
            <a class="dock-icon icon-browser1" data-shortcut-slot="2" href="#" title="Shortcut 3"><i class="fa-brands fa-opera"></i></a>
            <a class="dock-icon icon-browser2 active" data-shortcut-slot="3" href="#" title="Shortcut 4"><i class="fa-brands fa-firefox-browser"></i></a>
            <a class="dock-icon icon-video" data-shortcut-slot="4" href="#" title="Shortcut 5"><i class="fa-brands fa-youtube"></i></a>
            <a class="dock-icon icon-design1" data-shortcut-slot="5" href="#" title="Shortcut 6"><i class="fa-solid fa-bezier-curve"></i></a>
            <a class="dock-icon icon-design2" data-shortcut-slot="6" href="#" title="Shortcut 7"><i class="fa-solid fa-wand-magic-sparkles"></i></a>
            <a class="dock-icon icon-design3" data-shortcut-slot="7" href="#" title="Shortcut 8"><i class="fa-solid fa-palette"></i></a>
            <a class="dock-icon icon-effects" data-shortcut-slot="8" href="#" title="Shortcut 9"><i class="fa-solid fa-bolt"></i></a>
            <a class="dock-icon icon-word" data-shortcut-slot="9" href="#" title="Shortcut 10"><i class="fa-regular fa-file-word"></i></a>
            <a class="dock-icon icon-spotify" data-shortcut-slot="10" href="#" title="Shortcut 11"><i class="fa-brands fa-spotify"></i></a>
            <a class="dock-icon icon-games" data-shortcut-slot="11" href="#" title="Shortcut 12"><i class="fa-brands fa-steam"></i></a>
        </div>

        <!-- Watermark text -->
        <div class="watermark">sub scribe</div>
    </div>

    <script src="index4.js"></script>
    <script src="ui-switcher.js"></script>
</body>
</html>
