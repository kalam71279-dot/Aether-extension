<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Dashboard UI</title>
    <!-- FontAwesome for stroke icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #121212;
            color: #ffffff;
        }

        /* Desktop Background */
        .desktop {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                        url('https://i.pinimg.com/736x/da/6d/58/da6d58a043e7b4cdeaa2f3ad5e21eb6c.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }

        /* Top Navigation Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .top-left, .top-right {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .top-center-dock {
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 16px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .dock-icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            transition: color 0.2s;
        }

        .icon-btn:hover {
            color: #ffffff;
        }

        /* Right Sidebar Icons Stack */
        .sidebar-right {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            z-index: 10;
        }

        .side-icon {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            color: #fff;
            opacity: 0.9;
            transition: transform 0.2s;
        }

        .side-icon:hover {
            transform: scale(1.1);
        }

        /* Sidebar Icon Colors matching screenshot */
        /*.si-green { background-color: #2e7d32; }
        .si-yellow { background-color: #fbc02d; }
        .si-blue { background-color: #0288d1; }
        .si-purple { background-color: #7b1fa2; }
        .si-pink { background-color: #c2185b; }
        .si-mint { background-color: #00897b; }
        .si-cyan { background-color: #00acc1; }
        .si-blue-dark { background-color: #1565c0; }
        .si-purple-light { background-color: #8e24aa; }
        .si-indigo { background-color: #3f51b5; }
        .si-magenta { background-color: #ad1457; }
        .si-orange { background-color: #d84315; }
        .si-telegram { background-color: #039be5; }
        .si-grid { background-color: #37474f; }
        .si-settings { background-color: #455a64; }
*/
        /* Main Grid Area */
        .main-grid {
            display: grid;
            grid-template-columns: 240px 1fr 280px;
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            z-index: 5;
        }

        .widget-card {
            background: rgba(30, 30, 30, 0.4);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Clock Widget */
        .clock-widget {
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .clock-container {
            position: relative;
            width: 90px;
            height: 90px;
        }

        .clock-hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 4px;
        }

        .hour-hand {
            width: 3px;
            height: 25px;
            background-color: #a0c4ff;
            transform: translateX(-50%) rotate(210deg);
        }

        .minute-hand {
            width: 2px;
            height: 38px;
            background-color: #ffffff;
            transform: translateX(-50%) rotate(120deg);
        }

        .second-hand {
            width: 1.5px;
            height: 42px;
            background-color: #ffd166;
            transform: translateX(-50%) rotate(45deg);
        }

        .clock-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background-color: #ffd166;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* Search & Center Widgets */
        .center-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-bar-container {
            background: rgba(20, 20, 20, 0.5);
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .search-bar-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 6px;
        }

        .search-input-area {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }

        .mini-widgets-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .mini-card {
            background: rgba(30, 30, 30, 0.3);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Right Column Widgets */
        .right-column-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .news-item {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.3;
        }

        .news-time {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 2px;
        }

        .action-card {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(30, 30, 30, 0.3);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Timeline / Calendar Strip Rows at Bottom */
        .timeline-section {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            z-index: 5;
        }

        .timeline-col {
            background: rgba(20, 20, 20, 0.25);
            border-radius: 12px;
            padding: 12px;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
        }

        .timeline-col.active {
            border-top-color: #ffd166;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .day-name {
            font-size: 10px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.5px;
        }

        .day-num {
            font-size: 20px;
            font-weight: 400;
        }

        .timeline-col.active .day-num {
            color: #ffd166;
        }

        .timeline-event {
            font-size: 11px;
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 8px;
            border-radius: 6px;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Bottom Footer Bar */
        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            z-index: 10;
            width: 100%;
        }

        .ticker {
            flex-grow: 1;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.8);
        }

        .footer-left, .footer-right {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .footer-icon {
            cursor: pointer;
            transition: color 0.2s;
        }

        .footer-icon:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="desktop">
        <!-- Top Navigation Bar -->
        <div class="top-bar">
            <div class="top-left">
                <button class="icon-btn"><i class="fa-solid fa-desktop"></i></button>
                <button class="icon-btn"><i class="fa-regular fa-window-maximize"></i></button>
                <button class="icon-btn"><i class="fa-regular fa-calendar"></i></button>
            </div>

            <!-- Top Center App Dock -->
            <div class="top-center-dock">
                <div class="dock-icon" style="background:#ea4335;"><i class="fa-solid fa-m"></i></div>
                <div class="dock-icon" style="background:#ff0000;"><i class="fa-brands fa-youtube"></i></div>
                <div class="dock-icon" style="background:#1877f2;"><i class="fa-brands fa-facebook-f"></i></div>
                <div class="dock-icon" style="background:#ff9900;"><i class="fa-brands fa-amazon"></i></div>
                <div class="dock-icon" style="background:#ffffff; color:#000;"><i class="fa-solid fa-brain"></i></div>
                <div class="dock-icon" style="background:#ff4500;"><i class="fa-brands fa-reddit-alien"></i></div>
                <div class="dock-icon" style="background:#000000;"><i class="fa-brands fa-x-twitter"></i></div>
                <div class="dock-icon" style="background:#0a66c2;"><i class="fa-brands fa-linkedin-in"></i></div>
                <div class="dock-icon" style="background:linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);"><i class="fa-brands fa-instagram"></i></div>
            </div>

            <div class="top-right">
                <button class="icon-btn"><i class="fa-solid fa-bookmark"></i></button>
            </div>
        </div>

        <!-- Right Side Icons Stack -->
        <div class="sidebar-right">
            <div class="side-icon si-green"><i class="fa-solid fa-thumbtack"></i></div>
            <div class="side-icon si-yellow"><i class="fa-regular fa-folder"></i></div>
            <div class="side-icon si-blue"><i class="fa-solid fa-magnifying-glass"></i></div>
            <div class="side-icon si-purple"><i class="fa-solid fa-chart-bar"></i></div>
            <div class="side-icon si-pink"><i class="fa-regular fa-calendar-days"></i></div>
            <div class="side-icon si-mint"><i class="fa-regular fa-comment-dots"></i></div>
            <div class="side-icon si-cyan"><i class="fa-regular fa-pen-to-square"></i></div>
            <div class="side-icon si-blue-dark"><i class="fa-solid fa-rotate"></i></div>
            <div class="side-icon si-purple-light"><i class="fa-regular fa-clock"></i></div>
            <div class="side-icon si-indigo"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
            <div class="side-icon si-magenta"><i class="fa-solid fa-music"></i></div>
            <div class="side-icon si-orange"><i class="fa-solid fa-bars"></i></div>
            <div class="side-icon si-telegram"><i class="fa-brands fa-telegram"></i></div>
            <div class="side-icon si-grid"><i class="fa-solid fa-grip"></i></div>
            <div class="side-icon si-settings"><i class="fa-solid fa-gear"></i></div>
        </div>

        <!-- Main Center Widgets Grid -->
        <div class="main-grid">
            <!-- Left: Clock Widget Card -->
            <div class="widget-card clock-widget">
                <div class="clock-container">
                    <div class="clock-hand hour-hand" id="hourHand"></div>
                    <div class="clock-hand minute-hand" id="minuteHand"></div>
                    <div class="clock-hand second-hand" id="secondHand"></div>
                    <div class="clock-center"></div>
                </div>
            </div>

            <!-- Center: Search & Mini Widgets -->
            <div class="center-stack">
                <div class="widget-card" style="padding: 12px 16px;">
                    <div class="search-bar-top">
                        <div style="display:flex; gap:12px; align-items:center;">
                            <span><i class="fa-solid fa-rotate-right"></i></span>
                            <span style="color:#fff; font-weight:500;"><i class="fa-regular fa-clock"></i> Frequent</span>
                            <span><i class="fa-regular fa-folder"></i> Favorites bar</span>
                        </div>
                        <div style="display:flex; gap:12px;">
                            <i class="fa-solid fa-plus"></i>
                            <i class="fa-solid fa-sliders"></i>
                        </div>
                    </div>
                    <div class="search-bar-container">
                        <div class="search-input-area">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <span>Search or @ for AI</span>
                        </div>
                        <i class="fa-solid fa-arrow-right" style="font-size:12px; color:rgba(255,255,255,0.5);"></i>
                    </div>
                </div>

                <div class="mini-widgets-row">
                    <div class="mini-card">
                        <i class="fa-solid fa-cloud-sun" style="font-size: 24px; color: #ffd166;"></i>
                        <div>
                            <div style="font-size: 14px; font-weight: 500;">?</div>
                            <div style="font-size: 11px; color: rgba(255,255,255,0.5);">Weather</div>
                        </div>
                    </div>
                    <div class="mini-card" style="visibility: hidden;"></div>
                </div>
            </div>

            <!-- Right: News & Notes Stack -->
            <div class="right-column-stack">
                <div class="widget-card">
                    <div class="news-time" data-news-primary-time>Loading...</div>
                    <a class="news-item" data-news-primary href="#">Fetching live headlines...</a>
                </div>
                <div class="widget-card" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;">
                    <div>
                        <div style="font-size: 10px; color: rgba(255,255,255,0.5);">News</div>
                        <div style="font-size: 13px; font-weight: 500;"><i class="fa-regular fa-newspaper"></i> News</div>
                    </div>
                    <span style="font-size: 11px; color: rgba(255,255,255,0.5);">/r/Technology</span>
                </div>
                <div class="action-card">
                    <i class="fa-regular fa-pen-to-square"></i>
                    <span>Add note</span>
                </div>
            </div>
        </div>

        <!-- Bottom Timeline Strip Rows -->
        <div class="timeline-section" data-news-timeline>
            <div class="timeline-col active">
                <div class="timeline-header">
                    <span class="day-name">MON</span>
                    <span class="day-num">10</span>
                </div>
                <div class="timeline-event"><i class="fa-regular fa-newspaper" style="font-size:10px;"></i> Loading live news...</div>
            </div>
            <div class="timeline-col">
                <div class="timeline-header">
                    <span class="day-name">TUE</span>
                    <span class="day-num">11</span>
                </div>
                <div class="timeline-event"><i class="fa-regular fa-newspaper" style="font-size:10px;"></i> Loading live news...</div>
                <div class="timeline-event"><i class="fa-regular fa-newspaper" style="font-size:10px;"></i> Loading live news...</div>
            </div>
            <div class="timeline-col">
                <div class="timeline-header">
                    <span class="day-name">WED</span>
                    <span class="day-num">12</span>
                </div>
                <div class="timeline-event"><i class="fa-regular fa-newspaper" style="font-size:10px;"></i> Loading live news...</div>
            </div>
            <div class="timeline-col">
                <div class="timeline-header">
                    <span class="day-name">THU</span>
                    <span class="day-num">13</span>
                </div>
            </div>
            <div class="timeline-col">
                <div class="timeline-header">
                    <span class="day-name">FRI</span>
                    <span class="day-num">14</span>
                </div>
                <div class="timeline-event"><i class="fa-regular fa-newspaper" style="font-size:10px;"></i> Loading live news...</div>
            </div>
        </div>

        <!-- Bottom Footer & News Ticker -->
        <div class="footer-bar">
            <div class="footer-left">
                <span class="footer-icon"><i class="fa-solid fa-cloud-sun"></i></span>
                <span class="footer-icon"><i class="fa-solid fa-question"></i></span>
            </div>
            <div class="ticker" data-news-ticker>Loading live news...</div>
            <div class="footer-right">
                <span class="footer-icon"><i class="fa-regular fa-envelope"></i> 20</span>
                <span class="footer-icon"><i class="fa-regular fa-star"></i></span>
            </div>
        </div>
    </div>

    <script src="index5.js"></script>
    <script src="news.js"></script>
    <script src="ui-switcher.js"></script>
</body>
</html>
